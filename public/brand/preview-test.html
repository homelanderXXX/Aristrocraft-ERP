<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'/>
<title>ARISTROCRAFT Tax Invoice Preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f1f5f9;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color: #0f172a;
  padding: 30px;
  line-height: 1.5;
  font-size: 13px;
}
.invoice-card {
  max-width: 820px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  padding: 40px 48px;
}
.top-line {
  height: 4px;
  background: linear-gradient(90deg, #F59E0B 0%, #D97706 40%, #0F172A 100%);
  margin: -40px -48px 32px -48px;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding-bottom: 24px;
  border-bottom: 1px solid #e2e8f0;
}
.logo-img {
  height: 52px;
  width: auto;
  object-fit: contain;
  display: block;
}
.company-desc {
  font-size: 11px;
  color: #64748b;
  margin-top: 8px;
  line-height: 1.4;
}
.invoice-title-block {
  text-align: right;
}
.invoice-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: #0f172a;
}
.inv-number {
  font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
  font-size: 13px;
  font-weight: 700;
  color: #d97706;
  margin-top: 2px;
}
.meta-grid {
  display: flex;
  justify-content: space-between;
  margin: 24px 0 28px 0;
  gap: 20px;
}
.meta-col {
  flex: 1;
}
.meta-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #94a3b8;
  margin-bottom: 6px;
}
.meta-val-name {
  font-size: 14px;
  font-weight: 700;
  color: #0f172a;
}
.meta-val-sub {
  font-size: 12px;
  color: #475569;
  line-height: 1.45;
  margin-top: 2px;
}
.table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0 24px 0;
}
.table th {
  background: #f8fafc;
  color: #475569;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 10px 14px;
  border-top: 1px solid #e2e8f0;
  border-bottom: 1px solid #e2e8f0;
  text-align: left;
}
.table th.r, .table td.r { text-align: right; }
.table th.c, .table td.c { text-align: center; }
.table td {
  padding: 14px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: top;
  font-size: 12.5px;
}
.item-title {
  font-weight: 600;
  color: #0f172a;
}
.item-desc {
  font-size: 11px;
  color: #64748b;
  margin-top: 3px;
  line-height: 1.4;
}
.summary-wrap {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-top: 8px;
  padding-top: 8px;
}
.summary-notes {
  max-width: 360px;
}
.in-words-card {
  background: #f8fafc;
  border-left: 3px solid #d97706;
  padding: 8px 12px;
  border-radius: 0 4px 4px 0;
  font-size: 11.5px;
}
.in-words-label {
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
  color: #64748b;
}
.in-words-val {
  font-weight: 600;
  color: #0f172a;
  margin-top: 2px;
}
.calc-table {
  width: 280px;
  border-collapse: collapse;
}
.calc-table td {
  padding: 6px 0;
  font-size: 12.5px;
}
.calc-table td.label {
  color: #64748b;
  font-weight: 500;
}
.calc-table td.val {
  text-align: right;
  font-weight: 600;
  color: #0f172a;
  font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
}
.calc-table tr.grand-total td {
  padding-top: 10px;
  border-top: 1px solid #cbd5e1;
  font-size: 15px;
}
.calc-table tr.grand-total td.label {
  font-weight: 800;
  color: #0f172a;
}
.calc-table tr.grand-total td.val {
  font-weight: 800;
  color: #d97706;
  font-size: 16px;
}
.footer {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.terms {
  font-size: 10.5px;
  color: #64748b;
  line-height: 1.5;
  max-width: 480px;
}
.sign-block {
  text-align: center;
  min-width: 170px;
}
.sign-line {
  border-bottom: 1px solid #0f172a;
  margin-bottom: 6px;
}
.sign-title {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  color: #0f172a;
}
.sign-sub {
  font-size: 9.5px;
  color: #64748b;
}
</style>
</head>
